name: elearning_staf
description: Aplikasi Staf Belajar Mandiri PKBM Tunas Harapan (admin, tutor, kepala sekolah).
publish_to: 'none'
version: 1.70.3+102

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  webview_flutter: ^4.4.0
  url_launcher: ^6.2.0
  google_fonts: ^6.2.1
  app_links: ^6.3.0
  file_picker: '>=8.1.2 <11.0.0'
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  google_sign_in: ^7.1.1
  google_sign_in_web: ^1.0.0
  web: ^1.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  geolocator: ^14.0.0
  open_filex: ^4.5.0
  share_plus: '>=11.0.0 <13.0.0'
  syncfusion_flutter_pdf: '>=27.1.48 <40.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_rapor.jpg

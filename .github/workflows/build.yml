name: Build Aplikasi Staf (APK + Web)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder Android & Web
        env:
          KUNCI_RILIS_B64: ${{ secrets.KUNCI_RILIS_B64 }}
          KUNCI_RILIS_SANDI: ${{ secrets.KUNCI_RILIS_SANDI }}
          KUNCI_RILIS_ALIAS: ${{ secrets.KUNCI_RILIS_ALIAS }}
        run: |
          flutter create --platforms=android,web --org id.pkbmtunasharapan --project-name elearning_staf .
          python3 tool/siapkan_platform.py

      - name: Unduh paket
        run: flutter pub get

      - name: Periksa kode (galat menggagalkan build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Tes otomatis: bila satu tes gagal, APK tidak dibuat dan tidak dirilis.
      - name: Tes backend Apps Script
        run: node tool/tes_backend.js

      - name: Tes aplikasi
        run: flutter test

      - name: Baca versi aplikasi
        id: versi
        run: echo "versi=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')" >> "$GITHUB_OUTPUT"

      # APK per arsitektur: jauh lebih kecil dari APK universal (di bawah batas 50 MB untuk rilis otomatis ke Drive).
      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Simpan APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bm-staf-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Rilis APK (mudah diunduh dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TH.E-Course v${{ steps.versi.outputs.versi }} (build ${{ github.run_number }})
          body: APK TH.E-Course v${{ steps.versi.outputs.versi }}. Untuk hampir semua HP pakai app-arm64-v8a-release.apk; HP lama (32-bit) pakai app-armeabi-v7a-release.apk.
          files: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Siapkan web untuk GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

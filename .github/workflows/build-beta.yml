name: Build APK Beta (pengembangan, tidak dirilis)

# APK beta untuk menguji perubahan migrasi Supabase TANPA mengganggu aplikasi produksi:
# - hanya dari cabang beta/** atau dijalankan manual; tidak pernah dari main
# - package id.pkbmtunasharapan.elearning_staf.beta + nama "TH.E-Course Beta" -> terpasang berdampingan
# - versi TH_VERSI berbeda dari rilis resmi/uji -> tidak dihitung pemakai rilis uji, tidak ditawari pembaruan
# - hasil hanya berupa artifact Actions: TIDAK membuat GitHub Release (pengambil APK otomatis backend
#   membaca releases/latest) dan TIDAK menerbitkan GitHub Pages
on:
  push:
    branches: ['beta/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

env:
  TH_VERSI_BETA: '1.91.90'

jobs:
  build-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder Android (mode beta)
        env:
          TH_BETA: '1'
          KUNCI_RILIS_B64: ${{ secrets.KUNCI_RILIS_B64 }}
          KUNCI_RILIS_SANDI: ${{ secrets.KUNCI_RILIS_SANDI }}
          KUNCI_RILIS_ALIAS: ${{ secrets.KUNCI_RILIS_ALIAS }}
        run: |
          flutter create --platforms=android --org id.pkbmtunasharapan --project-name elearning_staf .
          python3 tool/siapkan_platform.py

      - name: Unduh paket
        run: flutter pub get

      - name: Periksa kode
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tes backend Apps Script
        run: node tool/tes_backend.js

      - name: Tes aplikasi
        run: flutter test

      - name: Build APK beta
        run: >
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          --dart-define=TH_BETA=true --dart-define=TH_VERSI=${{ env.TH_VERSI_BETA }}

      - name: Simpan APK beta (artifact, bukan rilis)
        uses: actions/upload-artifact@v4
        with:
          name: th-ecourse-beta-apk-${{ env.TH_VERSI_BETA }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

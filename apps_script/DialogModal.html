<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      /* Font emoji disertakan eksplisit. Tanpa ini, karakter seperti ℹ️ dan ⚠️
         dirender dengan gaya teks monokrom dan muncul sebagai kotak kosong di
         sebagian Windows - persis seperti ikon berbentuk kotak "i" sebelumnya. */
      font-family: 'Segoe UI', Roboto, Arial, 'Segoe UI Emoji',
                   'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      color: #202124;
      overflow: hidden;
    }

    /* ===== Kepala berwarna sesuai nada pesan ===== */
    .head {
      padding: 20px 24px 18px 24px;
      display: flex;
      gap: 15px;
      align-items: flex-start;
      color: white;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .head::after {
      content: '';
      position: absolute;
      right: -30px; top: -50px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,0.09);
    }
    .head.info     { background: linear-gradient(135deg, #1a73e8, #1557b0); }
    .head.success  { background: linear-gradient(135deg, #34a853, #1e7e34); }
    .head.warning  { background: linear-gradient(135deg, #f9ab00, #ea8600); }
    .head.danger   { background: linear-gradient(135deg, #ea4335, #c5221f); }
    .head.question { background: linear-gradient(135deg, #5f6368, #3c4043); }

    .head .icon {
      font-size: 30px;
      line-height: 1;
      font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      background: rgba(255,255,255,0.18);
      width: 52px; height: 52px;
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      z-index: 1;
    }
    .head .htext { flex: 1; z-index: 1; padding-top: 2px; }
    .head .htitle { font-size: 16.5px; font-weight: 700; line-height: 1.3; margin-bottom: 3px; }
    .head .hsub { font-size: 12px; opacity: 0.92; }

    /* ===== Isi ===== */
    .body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px 4px 24px;
    }
    .body::-webkit-scrollbar { width: 9px; }
    .body::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 5px; }
    .body::-webkit-scrollbar-thumb:hover { background: #bdc1c6; }

    .message {
      font-size: 13.5px;
      line-height: 1.6;
      color: #3c4043;
      white-space: pre-line;
      margin-bottom: 4px;
    }

    /* ===== Kartu statistik ===== */
    .stats { display: flex; gap: 9px; margin: 16px 0 4px 0; flex-wrap: wrap; }
    .stat {
      flex: 1; min-width: 88px;
      background: #f8f9fa;
      border: 1px solid #edeff1;
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat .v { font-size: 21px; font-weight: 800; color: #1a73e8; line-height: 1.15; }
    .stat .v.good { color: #1e7e34; }
    .stat .v.bad  { color: #c5221f; }
    .stat .l { font-size: 11px; color: #5f6368; margin-top: 3px; }

    /* ===== Tautan ===== */
    .links { margin: 15px 0 4px 0; }
    .link-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px;
      background: #f1f6ff;
      border: 1px solid #d7e5fb;
      border-radius: 8px;
      margin-bottom: 7px;
      font-size: 12.5px;
      text-decoration: none;
      color: #1557b0;
      font-weight: 600;
    }
    .link-item:hover { background: #e4eefd; }

    /* ===== Daftar rincian ===== */
    .details-wrap { margin: 16px 0 4px 0; }
    .details-head {
      font-size: 11px; font-weight: 700; color: #5f6368;
      text-transform: uppercase; letter-spacing: 0.4px;
      margin-bottom: 7px;
      display: flex; align-items: center; gap: 7px;
    }
    .details {
      background: #fbfbfc;
      border: 1px solid #e8eaed;
      border-radius: 9px;
      max-height: 190px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .details::-webkit-scrollbar { width: 8px; }
    .details::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 4px; }
    .detail-row {
      font-size: 12px;
      line-height: 1.5;
      padding: 6px 13px;
      color: #3c4043;
      border-bottom: 1px solid #f3f4f6;
      word-break: break-word;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row.err { color: #c5221f; }
    .detail-row.ok  { color: #1e7e34; }

    /* ===== Kolom isian ===== */
    .field { margin: 15px 0 0 0; }
    .field label { display: block; font-size: 12.5px; font-weight: 600; color: #3c4043; margin-bottom: 5px; }
    .field .req { color: #d93025; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26,115,232,0.12);
    }
    .field input.invalid { border-color: #d93025; box-shadow: 0 0 0 3px rgba(217,48,37,0.1); }
    .field .hint { font-size: 11px; color: #80868b; margin-top: 5px; line-height: 1.45; }

    /* ===== Kaki / tombol ===== */
    .foot {
      padding: 14px 24px 18px 24px;
      display: flex;
      gap: 9px;
      justify-content: flex-end;
      align-items: center;
      border-top: 1px solid #f1f3f4;
      flex-shrink: 0;
      background: #ffffff;
    }
    .foot .spacer { flex: 1; }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, transform 0.08s;
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-cancel { background: #f1f3f4; color: #3c4043; }
    .btn-cancel:hover:not(:disabled) { background: #e4e6e8; }
    .btn-main { background: #1a73e8; color: white; }
    .btn-main:hover:not(:disabled) { background: #1557b0; }
    .btn-main.danger { background: #d93025; }
    .btn-main.danger:hover:not(:disabled) { background: #b8241a; }
    .btn-main.success { background: #1e8e3e; }
    .btn-main.success:hover:not(:disabled) { background: #17762f; }

    /* ===== Keadaan menunggu ===== */
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      display: inline-block;
      vertical-align: -2px;
      margin-right: 7px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .working-note {
      font-size: 11.5px;
      color: #80868b;
      margin-right: auto;
      display: none;
    }
    .working-note.show { display: block; }

    body.fade-in { animation: fadeIn 0.16s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>

<body class="fade-in">

  <div class="head" id="head">
    <div class="icon" id="icon">ℹ️</div>
    <div class="htext">
      <div class="htitle" id="title">—</div>
      <div class="hsub" id="subtitle" style="display:none;"></div>
    </div>
  </div>

  <div class="body" id="body">
    <div class="message" id="message"></div>
    <div class="stats" id="stats" style="display:none;"></div>
    <div class="links" id="links" style="display:none;"></div>
    <div id="fields"></div>
    <div class="details-wrap" id="detailsWrap" style="display:none;">
      <div class="details-head" id="detailsHead">Rincian</div>
      <div class="details" id="details"></div>
    </div>
  </div>

  <div class="foot">
    <span class="working-note" id="workingNote">Sedang diproses — jangan tutup jendela ini.</span>
    <button class="btn btn-cancel" id="cancelBtn" onclick="onCancel()">Tutup</button>
    <button class="btn btn-main" id="mainBtn" onclick="onMain()">OK</button>
  </div>

<script>
  // Config disisipkan sebagai literal JavaScript, dicetak SEKALI oleh server.
  //
  // PENTING - dua aturan yang wajib dijaga di baris di bawah:
  //   1. Harus memakai scriptlet FORCE-PRINT (tanda seru sebelum sama dengan).
  //      Scriptlet cetak biasa menerapkan contextual escaping yang merusak
  //      literal JSON di dalam blok script.
  //   2. JANGAN di-JSON.stringify lagi di sini - server sudah melakukannya.
  //      Dobel stringify membuat hasilnya jadi String, bukan Object, sehingga
  //      seluruh isi dialog tampil kosong (bug yang pernah terjadi).
  //
  // Catatan: komentar ini sengaja TIDAK menuliskan sintaks scriptlet secara
  // literal. Mesin template Apps Script memproses seluruh berkas sebagai teks
  // mentah, termasuk isi komentar JavaScript - menulis contohnya di sini justru
  // akan ikut dieksekusi dan menggagalkan evaluasi template.
  var config = <?!= configLiteral ?>;

  // Jaring pengaman: kalau config gagal tersisip dengan benar, tampilkan
  // pesan yang menjelaskan - jangan biarkan dialog tampil kosong tanpa
  // petunjuk apa pun, seperti yang terjadi pada bug sebelumnya.
  if (!config || typeof config !== 'object') {
    config = {
      tone: 'danger',
      icon: '❌',
      title: 'Dialog Gagal Dimuat',
      message: 'Isi dialog tidak terkirim dengan benar dari server.\n\n' +
               'Pastikan file Dialog.gs dan DialogModal.html sama-sama sudah disalin ke versi terbaru — ' +
               'keduanya harus cocok agar dialog bisa tampil.',
      confirmLabel: 'Tutup'
    };
  }

  function esc(v) {
    var d = document.createElement('div');
    d.textContent = (v === null || v === undefined) ? '' : String(v);
    return d.innerHTML;
  }

  // Menandai baris rincian berdasarkan isinya, supaya error langsung terlihat
  // merah tanpa server perlu mengirim metadata tambahan.
  function detailClass(text) {
    var t = String(text);
    if (t.indexOf('❌') !== -1 || /(^|\s)(error|gagal|tidak bisa)/i.test(t)) return 'err';
    if (t.indexOf('✅') !== -1) return 'ok';
    return '';
  }

  function render(cfg) {
    config = cfg;

    var tone = cfg.tone || 'info';
    document.getElementById('head').className = 'head ' + tone;
    document.getElementById('icon').textContent = cfg.icon || 'ℹ️';
    document.getElementById('title').textContent = cfg.title || '';

    var sub = document.getElementById('subtitle');
    if (cfg.subtitle) { sub.textContent = cfg.subtitle; sub.style.display = 'block'; }
    else { sub.style.display = 'none'; }

    document.getElementById('message').textContent = cfg.message || '';

    // --- Kartu statistik ---
    var statsEl = document.getElementById('stats');
    if (cfg.stats && cfg.stats.length) {
      var sh = '';
      for (var i = 0; i < cfg.stats.length; i++) {
        var s = cfg.stats[i];
        sh += '<div class="stat"><div class="v ' + (s.tone || '') + '">' + esc(s.value) + '</div>' +
              '<div class="l">' + esc(s.label) + '</div></div>';
      }
      statsEl.innerHTML = sh;
      statsEl.style.display = 'flex';
    } else {
      statsEl.style.display = 'none';
    }

    // --- Tautan ---
    var linksEl = document.getElementById('links');
    if (cfg.links && cfg.links.length) {
      var lh = '';
      for (var L = 0; L < cfg.links.length; L++) {
        lh += '<a class="link-item" href="' + esc(cfg.links[L].url) + '" target="_blank">🔗 ' +
              esc(cfg.links[L].label) + '</a>';
      }
      linksEl.innerHTML = lh;
      linksEl.style.display = 'block';
    } else {
      linksEl.style.display = 'none';
    }

    // --- Kolom isian ---
    var fieldsEl = document.getElementById('fields');
    if (cfg.inputs && cfg.inputs.length) {
      var fh = '';
      for (var f = 0; f < cfg.inputs.length; f++) {
        var inp = cfg.inputs[f];
        fh += '<div class="field"><label>' + esc(inp.label) +
              (inp.required ? ' <span class="req">*</span>' : '') + '</label>';

        if (inp.type === 'select') {
          fh += '<select id="inp_' + esc(inp.key) + '">';
          for (var o = 0; o < (inp.options || []).length; o++) {
            var opt = inp.options[o];
            var val = (opt && opt.value !== undefined) ? opt.value : opt;
            var lab = (opt && opt.label !== undefined) ? opt.label : opt;
            fh += '<option value="' + esc(val) + '"' +
                  (String(val) === String(inp.value || '') ? ' selected' : '') + '>' + esc(lab) + '</option>';
          }
          fh += '</select>';
        } else if (inp.type === 'textarea') {
          fh += '<textarea id="inp_' + esc(inp.key) + '" rows="3" placeholder="' +
                esc(inp.placeholder || '') + '">' + esc(inp.value || '') + '</textarea>';
        } else {
          fh += '<input type="' + esc(inp.type || 'text') + '" id="inp_' + esc(inp.key) +
                '" value="' + esc(inp.value || '') + '" placeholder="' + esc(inp.placeholder || '') + '">';
        }

        if (inp.hint) fh += '<div class="hint">' + esc(inp.hint) + '</div>';
        fh += '</div>';
      }
      fieldsEl.innerHTML = fh;
    } else {
      fieldsEl.innerHTML = '';
    }

    // --- Rincian ---
    var dw = document.getElementById('detailsWrap');
    if (cfg.details && cfg.details.length) {
      document.getElementById('detailsHead').textContent = cfg.detailsLabel || 'Rincian';
      var dh = '';
      for (var d = 0; d < cfg.details.length; d++) {
        dh += '<div class="detail-row ' + detailClass(cfg.details[d]) + '">' + esc(cfg.details[d]) + '</div>';
      }
      document.getElementById('details').innerHTML = dh;
      dw.style.display = 'block';
    } else {
      dw.style.display = 'none';
    }

    // --- Tombol ---
    var mainBtn = document.getElementById('mainBtn');
    var cancelBtn = document.getElementById('cancelBtn');

    mainBtn.disabled = false;
    mainBtn.className = 'btn btn-main' +
      (tone === 'danger' && cfg.action ? ' danger' : '') +
      (tone === 'success' && !cfg.action ? ' success' : '');
    mainBtn.textContent = cfg.confirmLabel || (cfg.action ? 'Ya, Lanjutkan' : 'Selesai');

    var showCancel = cfg.showCancel;
    if (showCancel === undefined) showCancel = !!cfg.action;
    cancelBtn.style.display = showCancel ? 'inline-block' : 'none';
    cancelBtn.textContent = cfg.cancelLabel || 'Batal';

    document.getElementById('workingNote').className = 'working-note';

    // Fokuskan kolom isian pertama supaya pengguna bisa langsung mengetik.
    if (cfg.inputs && cfg.inputs.length) {
      var first = document.getElementById('inp_' + cfg.inputs[0].key);
      if (first) { first.focus(); if (first.select) first.select(); }
    }

    document.getElementById('body').scrollTop = 0;
  }

  function collectInputs() {
    var values = {};
    if (!config.inputs) return values;
    for (var i = 0; i < config.inputs.length; i++) {
      var el = document.getElementById('inp_' + config.inputs[i].key);
      values[config.inputs[i].key] = el ? el.value : '';
    }
    return values;
  }

  function validateInputs() {
    if (!config.inputs) return true;
    var ok = true;
    for (var i = 0; i < config.inputs.length; i++) {
      var inp = config.inputs[i];
      if (!inp.required) continue;
      var el = document.getElementById('inp_' + inp.key);
      if (el && !String(el.value).trim()) {
        el.className = 'invalid';
        if (ok) el.focus();
        ok = false;
      } else if (el) {
        el.className = '';
      }
    }
    return ok;
  }

  function onMain() {
    // Tanpa aksi, tombol utama hanya menutup dialog.
    if (!config.action) {
      google.script.host.close();
      return;
    }

    if (!validateInputs()) return;

    var mainBtn = document.getElementById('mainBtn');
    var cancelBtn = document.getElementById('cancelBtn');
    mainBtn.disabled = true;
    cancelBtn.disabled = true;
    mainBtn.innerHTML = '<span class="spinner"></span>Memproses...';
    document.getElementById('workingNote').className = 'working-note show';

    // Dialog ini punya spinner sendiri di tombolnya, tapi itu hanya mematikan
    // DUA tombol. Kolom isian, tautan, dan tombol lain yang mungkin digambar
    // oleh config masih hidup - dan sebagian aksi di balik dialog ini
    // (Hapus Semua Draft, Mulai Tahun Ajaran Baru) berjalan lama sekali.
    // Overlay menutup seluruh permukaannya.
    if (typeof busyShow === 'function') {
      busyShow({
        judul: 'Menjalankan ' + (config.confirmLabel || 'tindakan'),
        sub: 'Jangan tutup jendela ini sampai hasilnya muncul.'
      });
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (typeof busyHide === 'function') busyHide();
        cancelBtn.disabled = false;
        // Hasil digambar ulang di dialog yang SAMA. Kalau hasilnya membawa
        // `action` lagi, dialog otomatis bersiap untuk langkah berikutnya -
        // ini yang membuat alur bertahap (mis. validasi sheet → tawarkan buat
        // sheet → tawarkan hapus sheet) berjalan tanpa dialog beruntun.
        render(result);
      })
      .withFailureHandler(function(error) {
        if (typeof busyHide === 'function') busyHide();
        cancelBtn.disabled = false;
        render({
          tone: 'danger', icon: '❌', title: 'Terjadi Kesalahan',
          message: error && error.message ? error.message : String(error),
          confirmLabel: 'Tutup'
        });
      })
      .runDialogAction(config.action, config.actionArgs || [], collectInputs());
  }

  function onCancel() {
    google.script.host.close();
  }

  // Enter mengirim, Escape menutup - dialog bawaan pun begitu, jadi kebiasaan
  // pengguna tetap terpakai.
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { onCancel(); return; }
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
      var btn = document.getElementById('mainBtn');
      if (!btn.disabled) onMain();
    }
  });

  render(config);
</script>
</body>
</html>

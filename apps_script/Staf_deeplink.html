<script>
// Login Google dari aplikasi BM Staf: halaman dibuka dengan ?appsso=1 di browser HP, lalu setelah login Google
// tiket SSO tidak dipakai di halaman ini, melainkan diserahkan ke aplikasi lewat tautan bmstaf://sso?tiket=...
function bmTandaiAppSso_() {
  var card = document.querySelector('#layarLogin .card');
  if (!card) return;
  var info = document.createElement('div');
  info.className = 'pesan info';
  info.style.display = 'block';
  info.textContent = 'Masuk dari aplikasi BM Staf: ketuk "Masuk dengan Google", pilih akun Anda, lalu ketuk "Kembali ke aplikasi".';
  card.insertBefore(info, card.firstChild);
}
function bmKembaliKeApp_(tiket) {
  var card = document.querySelector('#layarLogin .card') || document.body;
  while (card.firstChild) card.removeChild(card.firstChild);
  var j = document.createElement('h3'); j.textContent = 'Login Google berhasil';
  var p = document.createElement('p'); p.textContent = 'Ketuk tombol di bawah untuk kembali ke aplikasi BM Staf.';
  var a = document.createElement('a');
  a.className = 'btn blok'; a.target = '_top';
  a.href = 'bmstaf://sso?tiket=' + encodeURIComponent(tiket);
  a.textContent = 'Kembali ke aplikasi BM Staf';
  a.style.cssText = 'display:block;text-align:center;text-decoration:none;margin-top:12px';
  card.appendChild(j); card.appendChild(p); card.appendChild(a);
}
</script>
<script>
// Dipakai aplikasi Flutter: ?halaman=staf&t=TOKEN&tab=tabX|Teks menu&mapel=ID_MAPEL
// Token dari aplikasi disimpan ke sesi halaman ini, lalu tab/mapel yang diminta dibuka.
(function () {
  try {
    if (!window.google || !google.script || !google.script.url) return;
    google.script.url.getLocation(function (loc) {
      var p = (loc && loc.parameter) || {};
      if (p.appsso) { try { localStorage.setItem('bmAppSso', '1'); } catch (e) {} bmTandaiAppSso_(); return; }
      if (!p.t) return;
      try { simpanToken(p.t); } catch (e) {}
      try { S.token = p.t; } catch (e) {}
      try { muatProfil(); } catch (e) { return; }
      var coba = 0;
      var tunggu = setInterval(function () {
        coba++;
        var siap = false;
        try { siap = !!(S.profil && S.profil.peran); } catch (e) {}
        if (!siap && coba < 60) return;
        clearInterval(tunggu);
        if (!siap) return;
        try {
          if (p.mapel && S.profil.mapel) {
            if (typeof tampilTabAdmin === 'function' && S.profil.peran === 'Admin') tampilTabAdmin('lihat');
            var m = S.profil.mapel.filter(function (x) { return String(x.idMapel) === String(p.mapel); })[0];
            if (m) pilihMapel(m);
            return;
          }
          if (p.tab) {
            var el = document.getElementById(p.tab);
            if (!el) {
              var semua = document.querySelectorAll('#areaAdminTabs .tab, .tab');
              for (var i = 0; i < semua.length; i++) {
                if ((semua[i].textContent || '').indexOf(p.tab) >= 0) { el = semua[i]; break; }
              }
            }
            if (el) el.click();
          }
        } catch (e) {}
      }, 250);
    });
  } catch (e) {}
})();
</script>
